# Hub E2E smoke (2026-11-23) — nightly against the deployed dev site,
# plus on-demand (Actions tab → "E2E smoke" → Run workflow, e.g. right
# after a deploy).
#
# Deliberately NOT a PR gate: it exercises a live environment, so a
# Railway cold start or a dev-data change shouldn't block merging code.
# Repository variable E2E_BASE_URL (and E2E_API_URL) can point it at a
# different environment; defaults live in playwright.config.ts.
name: E2E smoke

on:
  schedule:
    - cron: "23 7 * * *" # nightly, off the :00 rush
  workflow_dispatch:

jobs:
  smoke:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
